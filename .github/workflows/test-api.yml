name: API-Test

# Nur manuell startbar (Actions → API-Test → Run workflow)
on:
  workflow_dispatch:

permissions:
  contents: read   # Der Test darf nur lesen, nichts ins Repo schreiben

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r agent/requirements.txt

      - name: API-Verbindung testen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent/test_api.py
