name: Startup Radar

on:
  # Automatisch jeden Montag um 05:17 UTC (= 06:17 Uhr deutscher Winterzeit).
  # Ungerade Minute, weil zur vollen Stunde viele Workflows gleichzeitig starten.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      modus:
        description: "testlauf = nichts speichern, vollstaendig = Datenbank aktualisieren"
        type: choice
        options: [testlauf, vollstaendig]
        default: testlauf
      felder:
        description: "alle oder z. B. retail,food"
        default: alle
      debug:
        description: "Ausführliches Protokoll (gesehene URLs, Rohdaten)"
        type: boolean
        default: false

# Nie zwei Läufe gleichzeitig (sonst überschreiben sie sich die Daten)
concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write   # nötig, um die aktualisierten Daten ins Repo zu schreiben

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r agent/requirements.txt

      - name: Agent ausführen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Eingaben über Umgebungsvariablen statt direkt im Befehl (Schutz vor Befehlsinjektion)
          # Beim automatischen Montagslauf gibt es keine Eingaben -> Standardwerte
          MODUS: ${{ inputs.modus || 'vollstaendig' }}
          FELDER: ${{ inputs.felder || 'alle' }}
          DEBUG: ${{ inputs.debug || 'false' }}
        run: python agent/radar.py --modus "$MODUS" --felder "$FELDER"

      - name: Daten speichern (nur im Modus vollstaendig)
        if: github.event_name == 'schedule' || inputs.modus == 'vollstaendig'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Daten."
          else
            git commit -m "Radar-Lauf $(date +%Y-%m-%d): Daten aktualisiert"
            git pull --rebase
            git push
          fi

      - name: Ergebnis als Download ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ergebnis
          path: out/
          if-no-files-found: ignore
