name: Startup Radar

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "testlauf = nichts speichern, vollstaendig = Datenbank aktualisieren"
        type: choice
        options: [testlauf, vollstaendig]
        default: testlauf
      felder:
        description: "alle oder z. B. retail,food"
        default: alle
      debug:
        description: "Ausführliches Protokoll (gesehene URLs, Rohdaten)"
        type: boolean
        default: false

permissions:
  contents: write   # nötig, um die aktualisierten Daten ins Repo zu schreiben

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r agent/requirements.txt

      - name: Agent ausführen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Eingaben über Umgebungsvariablen statt direkt im Befehl (Schutz vor Befehlsinjektion)
          MODUS: ${{ inputs.modus }}
          FELDER: ${{ inputs.felder }}
          DEBUG: ${{ inputs.debug }}
        run: python agent/radar.py --modus "$MODUS" --felder "$FELDER"

      - name: Daten speichern (nur im Modus vollstaendig)
        if: inputs.modus == 'vollstaendig'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Daten."
          else
            git commit -m "Radar-Lauf $(date +%Y-%m-%d): Daten aktualisiert"
            git push
          fi

      - name: Ergebnis als Download ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ergebnis
          path: out/
          if-no-files-found: ignore
